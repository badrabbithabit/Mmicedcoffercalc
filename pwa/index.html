<!DOCTYPE html>
<!--
  Coffee Ratio Calculator — index.html (Split-flap flipboard, iPhone Air)

  ── ID Map ──────────────────────────────────────────────────────
    flipboard / tile-grid   → split-flap board (top area)
    quote-board / quote-grid → daily quote board (second board, below)
    grounds-display     → current grounds value (bottom card)
   grounds-slider      → grounds input (15-60g) — the only user input
   warning / warning-text → max-batch warning (hidden unless triggered)
-->

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Coffee ratio calculator for Japanese iced coffee">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>BRH Brewhouse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="subway">
  <div class="app">

    <!-- PANEL 1 — brand + recipe flipboard, in a lighter-black box -->
    <div class="panel panel-top">
      <header class="brand" role="banner">
        <span class="brand-name">BRH</span>
        <span class="brand-sub">Brewhouse</span>
      </header>

      <!-- SPLIT-FLAP FLIPBOARD — all outputs -->
      <main class="flipboard-zone">
        <div class="board" id="flipboard" role="status" aria-live="polite" aria-label="Coffee recipe outputs">
          <div class="tile-grid" id="tile-grid"></div>
        </div>
      </main>
    </div>

    <!-- PANEL 2 — daily quote, in its own lighter-black box -->
    <div class="panel panel-quote">
      <section class="quote-zone" aria-label="Coffee quote of the day">
        <div class="board board-quote" id="quote-board" role="status" aria-live="polite">
          <div class="tile-grid" id="quote-grid"></div>
        </div>
      </section>
    </div>

    <!-- Spacer — absorbs leftover height so both boards stay grouped at top -->
    <div class="board-spacer" aria-hidden="true"></div>

    <!-- CONTROLS — bottom third (NOT flipboard style) -->
    <section class="controls">
      <div class="control-row">
        <span class="control-label">Grounds</span>
        <span class="control-value" id="grounds-display">30 g</span>
      </div>
      <input
        type="range"
        id="grounds-slider"
        class="slider"
        min="15"
        max="60"
        step="1"
        value="30"
        aria-label="Coffee grounds in grams"
      >
      <div class="slider-ranges">
        <span>15 g</span>
        <span>60 g</span>
      </div>

      <div class="warning" id="warning" hidden>
        <svg class="warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span class="warning-text" id="warning-text"></span>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
