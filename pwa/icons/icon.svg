<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#6b7c66"/>
  <!-- straw (behind cup) -->
  <g transform="rotate(16 300 90)">
    <rect x="292" y="34" width="26" height="150" rx="13" fill="#eef3ec"/>
    <rect x="292" y="60" width="26" height="18" fill="#6b7c66" opacity="0.35"/>
  </g>
  <!-- ice cubes above rim -->
  <g fill="#eef3ec">
    <rect x="196" y="66" width="58" height="58" rx="12" transform="rotate(-10 225 95)"/>
    <rect x="266" y="86" width="50" height="50" rx="10" transform="rotate(14 291 111)" opacity="0.85"/>
  </g>
  <!-- steam -->
  <g stroke="#f5f0eb" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M232 148 q14 -18 0 -34"/>
    <path d="M284 148 q-14 -18 0 -34"/>
  </g>
  <!-- cup body -->
  <path d="M166 172 h180 v168 a76 76 0 0 1 -76 76 h-28 a76 76 0 0 1 -76 -76 z" fill="#f5f0eb"/>
  <!-- coffee liquid -->
  <path d="M166 240 h180 v100 a76 76 0 0 1 -76 76 h-28 a76 76 0 0 1 -76 -76 z" fill="#3b2f2a"/>
  <!-- ice in the drink -->
  <g fill="#f5f0eb" opacity="0.95">
    <rect x="196" y="262" width="44" height="44" rx="9" transform="rotate(-12 218 284)"/>
    <rect x="258" y="276" width="38" height="38" rx="8" transform="rotate(18 277 295)" opacity="0.8"/>
  </g>
  <!-- cup rim -->
  <rect x="150" y="154" width="212" height="24" rx="12" fill="#f5f0eb"/>
  <!-- saucer -->
  <rect x="128" y="432" width="256" height="20" rx="10" fill="#f5f0eb" opacity="0.9"/>
</svg>
